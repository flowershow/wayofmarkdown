<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Way of Markdown — mark</title>
<meta name="robots" content="noindex">
<!-- The animated brand mark, embedded by the homepage hero in an iframe.
     Transparent background so it sits on whatever the page is. Green rather
     than ink because an iframe cannot see the parent's data-theme, and green
     reads on both. Kept out of listings by contentHide in config.json. -->
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  svg { display: block; width: 100%; height: 100vh; }
  .glyph {
    fill: #16a34a;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-weight: 600;
    text-anchor: middle;
    dominant-baseline: central;
  }
  .glyph--soft { opacity: .72; }
  .glyph--faint { opacity: .3; }
  @media (prefers-color-scheme: dark) { .glyph { fill: #4ade80; } }
</style>
</head>
<body>
<svg data-glyph-stage viewBox="0 14 260 118" preserveAspectRatio="xMidYMid meet" role="img" aria-label="A figure in profile, written in Markdown punctuation, pressing both palms forward">
  <g data-glyphs></g>
</svg>
<script>
(() => {
  "use strict";


    const clamp = (v, lo = 0, hi = 1) => Math.min(hi, Math.max(lo, v));
    const smooth = v => { const x = clamp(v); return x * x * (3 - 2 * x); };

    // Catmull-Rom through the control points, sampled to a dense polyline.
    function spline(points, per = 12) {
      const pts = [points[0], ...points, points[points.length - 1]];
      const out = [];
      for (let i = 1; i < pts.length - 2; i += 1) {
        const [p0, p1, p2, p3] = [pts[i - 1], pts[i], pts[i + 1], pts[i + 2]];
        for (let j = 0; j < per; j += 1) {
          const t = j / per, t2 = t * t, t3 = t2 * t;
          out.push([
            0.5 * (2 * p1[0] + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
            0.5 * (2 * p1[1] + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)
          ]);
        }
      }
      out.push(points[points.length - 1]);
      return out;
    }

    // Piecewise width profile along the stroke, in [u, width] stops.
    function widthAt(stops, u) {
      if (u <= stops[0][0]) return stops[0][1];
      for (let i = 1; i < stops.length; i += 1) {
        if (u <= stops[i][0]) {
          const [u0, w0] = stops[i - 1];
          const [u1, w1] = stops[i];
          const k = u1 === u0 ? 0 : (u - u0) / (u1 - u0);
          return w0 + (w1 - w0) * (k * k * (3 - 2 * k));
        }
      }
      return stops[stops.length - 1][1];
    }

    // A tapered brush stroke: the outline of a variable-width ribbon. This
    // is what separates ink from a stick figure, so it is the core of the
    // whole study.
    function brush(points, stops, per = 12) {
      const pts = spline(points, per);
      const arc = [0];
      for (let i = 1; i < pts.length; i += 1) {
        arc[i] = arc[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
      }
      const total = arc[arc.length - 1] || 1;
      const left = [];
      const right = [];
      for (let i = 0; i < pts.length; i += 1) {
        const a = pts[Math.max(0, i - 1)];
        const b = pts[Math.min(pts.length - 1, i + 1)];
        const len = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
        const nx = -(b[1] - a[1]) / len;
        const ny = (b[0] - a[0]) / len;
        const half = widthAt(stops, arc[i] / total) / 2;
        left.push([pts[i][0] + nx * half, pts[i][1] + ny * half]);
        right.push([pts[i][0] - nx * half, pts[i][1] - ny * half]);
      }
      const r = n => `${n.toFixed(1)}`;
      let d = `M${r(left[0][0])} ${r(left[0][1])}`;
      for (let i = 1; i < left.length; i += 1) d += `L${r(left[i][0])} ${r(left[i][1])}`;
      for (let i = right.length - 1; i >= 0; i -= 1) d += `L${r(right[i][0])} ${r(right[i][1])}`;
      return d + "Z";
    }

    // Two-bone IK. Joints are derived rather than hand-placed, so limbs keep
    // their length and the pose stays coherent through the interpolation.
    function ik(root, target, upper, lower, bend) {
      const dx = target[0] - root[0];
      const dy = target[1] - root[1];
      const raw = Math.hypot(dx, dy) || 1e-6;
      const ux = dx / raw;
      const uy = dy / raw;
      const d = clamp(raw, Math.abs(upper - lower) + 0.01, (upper + lower) - 0.01);
      const along = (d * d + upper * upper - lower * lower) / (2 * d);
      const off = Math.sqrt(Math.max(0, upper * upper - along * along));
      let px = -uy;
      let py = ux;
      if (px * bend[0] + py * bend[1] < 0) { px = -px; py = -py; }
      return [root[0] + ux * along + px * off, root[1] + uy * along + py * off];
    }

    /* ------------------------------------------------------------------ *
     * Movement: An — press and push — performed in place.
     *
     * The feet never move. All of it is the weight rolling back onto the
     * rear leg and forward into the front one, with both palms drawing down
     * and in, then pressing out together. Tracks are cyclic and
     * interpolated with Catmull-Rom so velocity is continuous through the
     * loop: the gesture breathes rather than restarting.
     * ------------------------------------------------------------------ */

    const GROUND = 124;
    const ANKLE_Y = 119;
    const THIGH = 23.5, SHIN = 23.5;
    const UPPER_ARM = 20, FOREARM = 19;
    const BASE_HIP = 76.5;
    const HEAD_SCALE = 1.11;
    const NECK_PIVOT = [2, 45];

    // Fixed bow stance. Rear foot behind, front foot ahead, both planted.
    const REAR_ANKLE = [-20, ANKLE_Y];
    const FRONT_ANKLE = [19, ANKLE_Y];

    function track(stops, t) {
      const n = stops.length;
      let i = 0;
      while (i < n - 2 && t > stops[i + 1][0]) i += 1;
      const p1 = stops[i];
      const p2 = stops[i + 1];
      const p0 = i > 0 ? stops[i - 1] : [stops[n - 2][0] - 1, stops[n - 2][1]];
      const p3 = i + 2 < n ? stops[i + 2] : [stops[1][0] + 1, stops[1][1]];
      const h = (p2[0] - p1[0]) || 1e-6;
      const u = clamp((t - p1[0]) / h);
      const m1 = (p2[1] - p0[1]) / ((p2[0] - p0[0]) || 1e-6) * h;
      const m2 = (p3[1] - p1[1]) / ((p3[0] - p1[0]) || 1e-6) * h;
      const u2 = u * u, u3 = u2 * u;
      return (2 * u3 - 3 * u2 + 1) * p1[1] + (u3 - 2 * u2 + u) * m1 + (-2 * u3 + 3 * u2) * p2[1] + (u3 - u2) * m2;
    }

    // The weight. This is the whole movement; everything else follows it.
    // The holds at each end are what keep it from reading as a machine cycle.
    const SHIFT = [[0, 7], [.10, 7], [.45, -6], [.56, -6], [.90, 7], [1, 7]];
    const HIP_Y = [[0, 82], [.10, 82], [.45, 84.7], [.56, 84.7], [.90, 82], [1, 82]];
    const LEAN = [[0, 2], [.10, 2], [.45, -1.6], [.56, -1.6], [.90, 2], [1, 2]];
    // The front toe lifts a little as the weight comes off it.
    const FRONT_TOE = [[0, 0], [.14, 0], [.45, -11], [.56, -11], [.86, 0], [1, 0]];
    // The rear foot rolls: the heel lifts a little as the weight leaves it
    // and presses back down through the push. Adding a step would be the
    // other way to give the legs something to do, and it is the wrong way —
    // a step cycle reads as walking however slowly it is played.
    const REAR_TOE = [[0, 2.5], [.12, 2], [.45, -3.5], [.58, -3], [.88, 2.5], [1, 2.5]];

    // Both palms trace the same arc, the far one trailing slightly low and
    // behind. In strict profile two hands at identical height would read as
    // one thick hand, so that offset is doing real work.
    const HAND_A_X = [[0, 38], [.14, 35], [.30, 24], [.45, 14], [.56, 13], [.70, 23], [.86, 34], [1, 38]];
    const HAND_A_Y = [[0, 44], [.14, 47], [.30, 56], [.45, 62], [.56, 60], [.70, 52], [.86, 45], [1, 44]];
    const HAND_B_X = [[0, 33], [.14, 31], [.30, 21], [.45, 12], [.56, 11], [.70, 19], [.86, 29], [1, 33]];
    const HAND_B_Y = [[0, 53], [.14, 55], [.30, 61], [.45, 67], [.56, 65], [.70, 59], [.86, 54], [1, 53]];

    const rot = (p, o, deg) => {
      const a = deg * Math.PI / 180;
      const c = Math.cos(a), s = Math.sin(a);
      const x = p[0] - o[0], y = p[1] - o[1];
      return [o[0] + x * c - y * s, o[1] + x * s + y * c];
    };

    function foot(ankle, angleDeg) {
      return {
        heel: rot([ankle[0] - 6, ankle[1] + 5], ankle, angleDeg),
        toe: rot([ankle[0] + 10, ankle[1] + 5], ankle, angleDeg)
      };
    }

    function pose(t, breath = 0) {
      const hipX = track(SHIFT, t);
      const hipY = track(HIP_Y, t) + breath;
      const lean = track(LEAN, t);
      const hip = [hipX, hipY];

      const rearFoot = foot(REAR_ANKLE, track(REAR_TOE, t));
      const frontFoot = foot(FRONT_ANKLE, track(FRONT_TOE, t));
      const kneeRear = ik(hip, REAR_ANKLE, THIGH, SHIN, [1, 0]);
      const kneeFront = ik(hip, FRONT_ANKLE, THIGH, SHIN, [1, 0]);

      // The upper body rides on the pelvis and leans a degree or two. The
      // head stays quiet, which is most of what reads as tai chi.
      const up = p => rot([p[0] + hipX, p[1] - (BASE_HIP - hipY)], hip, lean);
      // The head, scaled about the base of the neck. Measured against
      // standing proportions the figure was 8.55 heads tall; a real adult is
      // about 7.5 and an idealised figure 8.
      const head = q => up([NECK_PIVOT[0] + (q[0] - NECK_PIVOT[0]) * HEAD_SCALE,
                            NECK_PIVOT[1] + (q[1] - NECK_PIVOT[1]) * HEAD_SCALE]);
      const waist = up([-2.5, 66]);
      const chest = up([0, 56]);
      const neck = up([2, 45]);
      const nape = head([-1.2, 39.4]);
      const occiput = head([-4, 34]);
      const skull = head([-2.6, 29]);
      const crown = head([1.8, 26]);
      const forehead = head([6.4, 28.6]);
      const brow = head([8.8, 31.4]);
      const nose = head([9.6, 34.4]);
      const lip = head([7.2, 36]);
      const chin = head([7.6, 38.6]);
      const jaw = head([2.6, 40.6]);
      // A small bound topknot. At 56px the bare skull reads as a smudge;
      // this gives the head a silhouette to be recognised by.
      const knotBase = head([-2.4, 30.4]);
      const knot = head([-6.6, 27.6]);
      // The tail of the topknot, as a chain. Each link is given a little
      // more lag than the one above it, so the hair trails through itself
      // instead of swinging as one rigid piece — the thing the robe hem
      // needed and never got.
      const knot1 = head([-9.6, 30.4]);
      const knot2 = head([-11, 35.4]);
      const knotTip = head([-9.8, 40.6]);
      // One mark for the eye, set back under the brow.
      const eye = head([5.8, 32.2]);
      const throat = up([4, 43]);
      const chestFront = up([12, 53]);
      const belly = up([12, 64]);
      const lowBelly = up([6, 74]);
      const shoulderA = up([2, 46]);
      const shoulderB = up([1.5, 49.5]);

      // Hand arcs are authored freely, then pulled back inside the arm's
      // reach. Without this the IK silently clamps and the hand floats away
      // from the wrist.
      const reachable = (shoulder, target) => {
        const dx = target[0] - shoulder[0];
        const dy = target[1] - shoulder[1];
        const d = Math.hypot(dx, dy) || 1e-6;
        const max = (UPPER_ARM + FOREARM) * .985;
        if (d <= max) return target;
        return [shoulder[0] + dx / d * max, shoulder[1] + dy / d * max];
      };

      const lift = BASE_HIP - hipY;
      const handA = reachable(shoulderA, [track(HAND_A_X, t) + hipX, track(HAND_A_Y, t) - lift]);
      const handB = reachable(shoulderB, [track(HAND_B_X, t) + hipX, track(HAND_B_Y, t) - lift]);
      const elbowA = ik(shoulderA, handA, UPPER_ARM, FOREARM, [0, 1]);
      const elbowB = ik(shoulderB, handB, UPPER_ARM, FOREARM, [0, 1]);
      const wristA = [handA[0] - (handA[0] - elbowA[0]) * .18, handA[1] - (handA[1] - elbowA[1]) * .18];
      const wristB = [handB[0] - (handB[0] - elbowB[0]) * .18, handB[1] - (handB[1] - elbowB[1]) * .18];

      // The palm, cocked back at the wrist. In profile this one small mark
      // is most of what reads as tai chi rather than someone reaching for a
      // door handle, so the arm stroke runs on into it instead of tapering
      // away to a point.
      const palm = (wrist, hand, turn, length) => {
        const dx = hand[0] - wrist[0];
        const dy = hand[1] - wrist[1];
        const d = Math.hypot(dx, dy) || 1e-6;
        const a = turn * Math.PI / 180;
        const ux = dx / d, uy = dy / d;
        return [hand[0] + (ux * Math.cos(a) - uy * Math.sin(a)) * length,
                hand[1] + (ux * Math.sin(a) + uy * Math.cos(a)) * length];
      };

      return {
        hip, waist, chest, neck, nape, occiput, skull, crown, forehead,
        brow, nose, lip, chin, jaw, throat, chestFront, belly, lowBelly,
        knotBase, knot, knot1, knot2, knotTip, eye,
        shoulderA, shoulderB, handA, handB, elbowA, elbowB, wristA, wristB,
        palmA: palm(wristA, handA, -70, 5.5),
        palmB: palm(wristB, handB, -70, 5),
        rearAnkle: REAR_ANKLE, frontAnkle: FRONT_ANKLE,
        rearFoot, frontFoot, kneeRear, kneeFront
      };
    }

    const LEG_W = [[0, 3.2], [.14, 6.4], [.5, 4.2], [.82, 2.8], [1, 1.9]];
    const FOOT_W = [[0, 2.5], [.55, 2.6], [1, 1]];
    const ARM_A_W = [[0, 2.6], [.16, 4.6], [.6, 2.9], [.84, 2.2], [.9, 2.4], [1, .9]];
    const ARM_B_W = [[0, 2.2], [.16, 3.9], [.6, 2.5], [.85, 1.9], [.9, 2.1], [1, .8]];
    // One unbroken stroke from the base of the spine, up the back, around
    // the skull and over the crown: the "flow of the back into the head".
    const SPINE_W = [[0, 3.2], [.12, 6.6], [.4, 4.6], [.62, 3.4], [.82, 3], [1, 1.9]];
    const FACE_W = [[0, 1.6], [.3, 1], [.62, .9], [1, .3]];
    const KNOT_W = [[0, 2.4], [.28, 3.4], [.62, 2.6], [1, .8]];
    const EYE_W = [[0, 2.6], [1, 2.6]];
    const FRONT_W = [[0, .6], [.4, 1.7], [.75, 1.4], [1, .4]];

    // The body as a list of centrelines. Both renderings read from this, so
    // the ink figure and the syntax figure can never drift apart.
    const mixPt = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];

    // `cloth` is the same body sampled slightly earlier. Anything that
    // should trail the head rather than move with it is placed from it.
    function figure(p, cloth = p) {
      return [
        { cls: "ink", pts: [p.hip, p.kneeRear, p.rearAnkle, p.rearFoot.heel], w: LEG_W },
        { cls: "ink", pts: [p.rearFoot.heel, p.rearFoot.toe], w: FOOT_W, per: 6 },
        { cls: "ink ink--soft", pts: [p.shoulderB, p.elbowB, p.wristB, p.handB, p.palmB], w: ARM_B_W },
        { cls: "ink", pts: [p.hip, p.kneeFront, p.frontAnkle, p.frontFoot.heel], w: LEG_W },
        { cls: "ink", pts: [p.frontFoot.heel, p.frontFoot.toe], w: FOOT_W, per: 6 },
        { cls: "ink ink--faint", pts: [p.throat, p.chestFront, p.belly, p.lowBelly], w: FRONT_W },
        { cls: "ink", pts: [p.hip, p.waist, p.chest, p.neck, p.nape, p.occiput, p.skull, p.crown, p.forehead], w: SPINE_W },
        { cls: "ink", pts: [
            p.knotBase,
            p.knot,
            mixPt(p.knot1, cloth.knot1, .45),
            mixPt(p.knot2, cloth.knot2, .78),
            cloth.knotTip
          ], w: KNOT_W, density: .8 },
        { cls: "ink", pts: [p.eye, [p.eye[0] + .7, p.eye[1] + .5]], w: EYE_W, per: 3, single: true },
        { cls: "ink", pts: [p.forehead, p.brow, p.nose, p.lip, p.chin, p.jaw, p.throat], w: FACE_W, per: 8, density: .72 },
        { cls: "ink", pts: [p.shoulderA, p.elbowA, p.wristA, p.handA, p.palmA], w: ARM_A_W }
      ];
    }

    function strokes(p, cloth = p) {
      return figure(p, cloth).map(s => ({ cls: s.cls, d: brush(s.pts, s.w, s.per || 12) }));
    }

    /* ------------------------------------------------------------------ *
     * The same body, written in Markdown punctuation.
     *
     * Characters are laid along the stroke centrelines at fixed fractions
     * of arc length, so a given character keeps its identity and its place
     * on the body for the whole movement. Size follows the brush width, so
     * the taper survives the translation: heavy structural marks through
     * the hips and thighs, fine punctuation out at the hands.
     * ------------------------------------------------------------------ */

    const HEAVY = ["#", "#", ">", "*", "+"];
    const MID = ["_", "-", "|", "[", "]", "~", "="];
    const LIGHT = [".", "`", "'", ",", "-", "."];

    // Deterministic hash, so every glyph keeps the same character and the
    // same gust of wind on every cycle.
    const noise = (i, salt) => {
      const x = Math.sin(i * 127.1 + salt * 311.7) * 43758.5453;
      return x - Math.floor(x);
    };

    function polyline(points, per) {
      const pts = spline(points, per);
      const arc = [0];
      for (let i = 1; i < pts.length; i += 1) {
        arc[i] = arc[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
      }
      return { pts, arc, total: arc[arc.length - 1] || 1 };
    }

    // Walk the centreline once, dropping a glyph at each planned fraction.
    function alongStroke(points, per, fractions) {
      const { pts, arc, total } = polyline(points, per);
      const out = [];
      let i = 1;
      for (const u of fractions) {
        const target = u * total;
        while (i < arc.length - 1 && arc[i] < target) i += 1;
        const span = (arc[i] - arc[i - 1]) || 1;
        const k = (target - arc[i - 1]) / span;
        const dx = pts[i][0] - pts[i - 1][0];
        const dy = pts[i][1] - pts[i - 1][1];
        out.push({
          x: pts[i - 1][0] + dx * k,
          y: pts[i - 1][1] + dy * k,
          angle: Math.atan2(dy, dx) * 180 / Math.PI
        });
      }
      return out;
    }

    const GLYPH_SPACING = .78;  // of a character's own size

    // Planned once against the settled push, so glyph count and identity are
    // fixed for the whole animation. `front` is how far along the push each
    // glyph sits: the wind takes the leading hand first and the rear foot
    // last, and fills the figure back up in the same order.
    const GLYPH_PLAN = (() => {
      const settled = pose(0);
      const plan = [];
      let minX = Infinity;
      let maxX = -Infinity;

      figure(settled).forEach((stroke, k) => {
        const per = stroke.per || 12;
        const { total } = polyline(stroke.pts, per);
        // Walk the stroke, stepping by each character's own size. Spacing
        // keyed to the stroke average instead would blot the thick hips and
        // thin out the fine face line in the same figure.
        const sizeAt = u => clamp(widthAt(stroke.w, u) * 1.5, 3, 7);
        const fractions = [];
        if (stroke.single) {
          // A mark that is one character, not a run of them: the eye.
          fractions.push(.5);
        } else {
          const spread = GLYPH_SPACING * (stroke.density || 1);
          let walked = sizeAt(0) * .5;
          while (walked < total) {
            const u = walked / total;
            fractions.push(u);
            walked += Math.max(3.2 * (stroke.density || 1), sizeAt(u) * spread);
          }
          if (fractions.length < 2) fractions.push(.5);
        }
        const seats = alongStroke(stroke.pts, per, fractions);

        seats.forEach((seat, j) => {
          const width = widthAt(stroke.w, fractions[j]);
          const pick = width >= 3.8 ? HEAVY : width >= 2.2 ? MID : LIGHT;
          const g = plan.length;
          const forced = stroke.single ? "*" : null;
          plan.push({
            index: g,
            stroke: k,
            per,
            u: fractions[j],
            // Capped: the widest brush strokes would otherwise set
            // characters so large they merge into a blot.
            size: clamp(width * 1.5, 3, 7),
            char: forced || pick[Math.floor(noise(g, 7) * pick.length) % pick.length],
            faint: stroke.cls.includes("faint"),
            soft: stroke.cls.includes("soft"),
            x0: seat.x
          });
          minX = Math.min(minX, seat.x);
          maxX = Math.max(maxX, seat.x);
        });
      });

      const span = (maxX - minX) || 1;
      for (const g of plan) g.front = clamp((g.x0 - minX) / span);
      return plan;
    })();

    // Glyphs grouped by the stroke they sit on, worked out once. Each group
    // caches its own fractions so the per-frame walk allocates nothing.
    const GLYPH_GROUPS = (() => {
      const groups = [];
      for (const g of GLYPH_PLAN) {
        let group = groups[g.stroke];
        if (!group) group = groups[g.stroke] = { stroke: g.stroke, per: g.per, members: [], fractions: [] };
        group.members.push(g);
        group.fractions.push(g.u);
      }
      return groups.filter(Boolean);
    })();

    // Where every glyph sits on the body for a given pose. Returned in
    // GLYPH_PLAN order.
    function glyphLayout(p, cloth = p) {
      const body = figure(p, cloth);
      const out = new Array(GLYPH_PLAN.length);
      for (const group of GLYPH_GROUPS) {
        const seats = alongStroke(body[group.stroke].pts, group.per, group.fractions);
        group.members.forEach((g, j) => {
          out[g.index] = { plan: g, x: seats[j].x, y: seats[j].y, angle: seats[j].angle };
        });
      }
      return out;
    }


  const SVG_NS = "http://www.w3.org/2000/svg";
  const HAIR_LAG = .045;
  const trailing = (t, breath) => pose((t - HAIR_LAG + 1) % 1, breath);

    const GLYPH_LOOP_MS = 14000;
    const GLYPH_X = 118;

    // Phase boundaries within the cycle. The press starts while the last
    // characters are still arriving, so the figure is already moving as they
    // land — the wind flows into the movement rather than queueing behind it.
    const MOVE_FROM = .17;
    const MOVE_TO = .74;       // press finished
    const SCATTER_FROM = .79;  // wind takes them, after a hold

    // The push travels forward and slightly up; the scatter follows it.
    const WIND = (() => {
      const settled = pose(0);
      const gathered = pose(.5);
      const dx = settled.handA[0] - gathered.handA[0];
      // Damped: the hand rises more than the push does, and taking its raw
      // angle throws the characters off at a steeper slope than the
      // movement's own line.
      const dy = (settled.handA[1] - gathered.handA[1]) * .45;
      const d = Math.hypot(dx, dy) || 1;
      return [dx / d, dy / d];
    })();

    const glyphStages = [document.querySelector("[data-glyph-stage]")].map(svg => {
      const layer = svg.querySelector("[data-glyphs]");
      layer.setAttribute("transform", `translate(${GLYPH_X} 0)`);
      const nodes = GLYPH_PLAN.map(g => {
        const node = document.createElementNS(SVG_NS, "text");
        node.setAttribute("class", `glyph${g.faint ? " glyph--faint" : g.soft ? " glyph--soft" : ""}`);
        node.setAttribute("font-size", g.size.toFixed(2));
        node.textContent = g.char;
        layer.append(node);
        return node;
      });
      return nodes;
    });

    function drawGlyphs(t) {
      // The body holds the gathered pose while the characters arrive, runs
      // the press, then holds the finished push while they blow away.
      const moving = clamp((t - MOVE_FROM) / (MOVE_TO - MOVE_FROM));
      const u = .45 + moving * .55;
      const breath = Math.sin(t * Math.PI * 2) * .35;
      const seats = glyphLayout(pose(u % 1, breath), trailing(u % 1, breath));
      const gust = t * Math.PI * 2;

      for (let i = 0; i < seats.length; i += 1) {
        const seat = seats[i];
        const g = seat.plan;

        // Arrive back-to-front, leave front-to-back.
        const arriveAt = g.front * .10 + noise(i, 1) * .04;
        const arrive = smooth(clamp((t - arriveAt) / .13));
        const scatterAt = SCATTER_FROM + (1 - g.front) * .05 + noise(i, 2) * .025;
        const scatter = smooth(clamp((t - scatterAt) / .115));

        // Blown in from the left, drifting until they settle. Close in:
        // from far off-stage they read as a separate flock arriving rather
        // than as the figure coming together.
        const fromX = seat.x - 46 - noise(i, 3) * 52;
        const fromY = seat.y + (noise(i, 4) - .5) * 52;
        const drift = (1 - arrive) * 5;
        let x = fromX + (seat.x - fromX) * arrive + Math.sin(gust * 1.6 + i) * drift;
        let y = fromY + (seat.y - fromY) * arrive + Math.cos(gust * 1.9 + i * .7) * drift;

        // Carried off along the push. It disintegrates a short way and then
        // goes, rather than streaming across the frame: the fade outruns the
        // travel.
        const throwBy = (26 + noise(i, 5) * 42) * scatter * scatter;
        x += WIND[0] * throwBy + (noise(i, 6) - .5) * 16 * scatter;
        y += WIND[1] * throwBy + (noise(i, 8) - .5) * 20 * scatter;

        const spin = (noise(i, 9) - .5) * 190;
        const angle = seat.angle * arrive + (noise(i, 10) - .5) * 220 * (1 - arrive) + spin * scatter;
        const alpha = arrive * (1 - smooth(scatter) ** 1.15);

        for (const nodes of glyphStages) {
          const node = nodes[i];
          node.setAttribute("transform", `translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${angle.toFixed(1)})`);
          node.style.opacity = alpha.toFixed(3);
        }
      }
    }


  const reduced = matchMedia("(prefers-reduced-motion: reduce)");
  // `#t=0.6` freezes the mark at a moment, so it can be screenshotted or
  // linked to for review. Headless browsers do not advance rAF under
  // virtual time, so without this the mark cannot be captured at all.
  const at = new URLSearchParams(location.hash.slice(1)).get("t");
  if (at !== null) {
    drawGlyphs(Math.min(.999, Math.max(0, Number(at))));
  } else if (reduced.matches) {
    // A still mark: the settled push, with every character home.
    drawGlyphs(MOVE_TO);
  } else {
    let start = null;
    const tick = now => {
      if (start === null) start = now;
      drawGlyphs(((now - start) % GLYPH_LOOP_MS) / GLYPH_LOOP_MS);
      requestAnimationFrame(tick);
    };
    drawGlyphs(0);
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
