<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tai chi across the page — gesture study</title>
  <style>
    :root {
      color-scheme: light dark;
      --paper: #f5f3eb;
      --paper-deep: #ebe8dc;
      --ink: #17342b;
      --ink-soft: #65776f;
      --line: rgba(23, 52, 43, .14);
      --accent: #168a46;
      --panel: rgba(255, 255, 255, .52);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      margin: 0;
      color: var(--ink);
      background: linear-gradient(155deg, var(--paper), var(--paper-deep));
      font-family: ui-sans-serif, system-ui, sans-serif;
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(1.25rem, 5vw, 4.5rem);
    }

    .study {
      width: min(96vw, 78rem);
    }

    .copy {
      max-width: 42rem;
      margin-bottom: clamp(2.5rem, 7vw, 6rem);
    }

    .eyebrow {
      margin: 0 0 .7rem;
      color: var(--accent);
      font: 750 .7rem/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: ui-serif, Georgia, Cambria, "Times New Roman", serif;
      font-size: clamp(2.5rem, 6vw, 5.1rem);
      font-weight: 450;
      letter-spacing: -.052em;
      line-height: .95;
    }

    .lede {
      max-width: 37rem;
      margin: 1.15rem 0 0;
      color: var(--ink-soft);
      font-size: clamp(.95rem, 2vw, 1.08rem);
      line-height: 1.55;
    }

    .stage-shell {
      width: 100%;
      min-height: 80px;
      overflow: hidden;
      border-block: 1px solid var(--line);
      background: rgba(255, 255, 255, .16);
    }

    #motion-stage {
      display: block;
      width: 100%;
      height: auto;
      min-height: 80px;
      max-height: 140px;
    }

    .ink-stroke {
      fill: none;
      stroke: var(--ink);
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .spine { stroke-width: 2.85; }
    .lead-arm { stroke-width: 2.35; }
    .following-arm { stroke-width: 1.75; opacity: .56; }
    .grounded-leg { stroke-width: 2.75; }
    .stepping-leg { stroke-width: 2.2; }
    .centre { stroke-width: 1.35; opacity: .52; }

    #live-gesture {
      filter: url(#ink-waver);
    }

    .trail-snapshot {
      pointer-events: none;
      filter: url(#dry-brush);
    }

    .trail-snapshot .ink-stroke {
      stroke: var(--ink-soft);
    }

    #static-gesture { display: none; }

    .review-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-top: 1rem;
    }

    .phase {
      display: flex;
      align-items: center;
      gap: .55rem;
      min-width: 9rem;
      color: var(--ink-soft);
      font: 700 .66rem/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .phase::before {
      content: "";
      width: 1.4rem;
      height: 1px;
      background: var(--accent);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: .5rem;
    }

    button {
      appearance: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: .55rem .82rem;
      color: var(--ink);
      background: var(--panel);
      font: 700 .69rem/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      cursor: pointer;
    }

    button:hover { border-color: var(--accent); }
    button:focus-visible { outline: 3px solid rgba(22, 138, 70, .18); outline-offset: 2px; }
    button:disabled { cursor: default; opacity: .45; }

    .note {
      margin: 1.7rem 0 0;
      color: var(--ink-soft);
      font-size: .75rem;
      line-height: 1.5;
    }

    @media (max-width: 760px) {
      main { align-items: start; padding-inline: 1rem; }
      .copy { margin-bottom: 3rem; }
      .stage-shell { width: calc(100vw - 2rem); overflow: hidden; }
      #motion-stage { width: 180%; max-width: none; }
      .review-bar { align-items: flex-start; flex-direction: column; }
      .controls { justify-content: flex-start; }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #0c1713;
        --paper-deep: #13231c;
        --ink: #e3eee7;
        --ink-soft: #9bafa5;
        --line: rgba(227, 238, 231, .15);
        --accent: #4ade80;
        --panel: rgba(8, 17, 13, .52);
      }
      .stage-shell { background: rgba(255, 255, 255, .018); }
    }

    @media (prefers-reduced-motion: reduce) {
      #live-gesture,
      #gesture-trails { display: none; }
      #static-gesture { display: inline; }
    }
  </style>
</head>
<body data-study-version="3" data-rendering="gesture-lines" data-view="strict-profile">
  <main>
    <section class="study" aria-labelledby="study-title">
      <div class="copy">
        <p class="eyebrow">Motion study 03 · ink before syntax</p>
        <h1 id="study-title">A form unfolds.</h1>
        <p class="lede">One side-on tai chi phrase crossing the page. Earlier gestures hang briefly in the air, then dissolve.</p>
      </div>

      <div class="stage-shell">
        <svg id="motion-stage" viewBox="0 0 1000 140" role="img" aria-label="A sparse side-profile figure performing tai chi as it travels from left to right">
          <defs>
            <filter id="ink-waver" x="-8%" y="-8%" width="116%" height="116%">
              <feTurbulence type="fractalNoise" baseFrequency="0.018 0.11" numOctaves="2" seed="8" result="noise"></feTurbulence>
              <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.65" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
            </filter>
            <filter id="dry-brush" x="-8%" y="-8%" width="116%" height="116%">
              <feTurbulence type="fractalNoise" baseFrequency="0.025 0.13" numOctaves="2" seed="13" result="noise"></feTurbulence>
              <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.9"></feDisplacementMap>
            </filter>
          </defs>

          <g id="gesture-trails" aria-hidden="true"></g>

          <g id="live-gesture" aria-hidden="true">
            <path class="ink-stroke following-arm" data-stroke="following-arm"></path>
            <path class="ink-stroke stepping-leg" data-stroke="stepping-leg"></path>
            <path class="ink-stroke grounded-leg" data-stroke="grounded-leg"></path>
            <path class="ink-stroke spine" data-stroke="spine"></path>
            <path class="ink-stroke lead-arm" data-stroke="lead-arm"></path>
            <path class="ink-stroke centre" data-stroke="centre"></path>
          </g>

          <g id="static-gesture" transform="translate(760 0)" aria-hidden="true">
            <path class="ink-stroke following-arm" d="M -1 51 C 10 57 22 64 37 65 C 45 65 53 62 60 59"></path>
            <path class="ink-stroke stepping-leg" d="M 1 78 C 11 91 19 102 22 113 C 30 118 40 119 49 118"></path>
            <path class="ink-stroke grounded-leg" d="M -3 78 C -12 92 -17 105 -19 117 C -13 120 -6 120 1 119"></path>
            <path class="ink-stroke spine" d="M -3 78 C -10 66 -9 53 -4 39 C -6 30 -4 20 1 17 C 5 14 10 16 11 21 C 13 24 14 26 15 27"></path>
            <path class="ink-stroke lead-arm" d="M 1 51 C 16 47 31 43 43 36 C 51 31 58 28 67 28"></path>
            <path class="ink-stroke centre" d="M 4 44 C 7 51 9 58 12 64"></path>
          </g>
        </svg>
      </div>

      <div class="review-bar">
        <div class="phase"><span id="phase-name">Gather</span></div>
        <div class="controls" aria-label="Animation review controls">
          <button type="button" id="pause-animation">Pause</button>
          <button type="button" id="replay-animation">Replay</button>
        </div>
      </div>
      <p class="note">Gesture-only study. No Markdown marks yet; the homepage is unchanged.</p>
    </section>
  </main>

  <script>
    const MOVEMENT_LOOP_MS = 18000;
    const TRAIL_LIFETIME_MS = 2800;
    const TRAIL_SAMPLE_MS = 700;
    const TRAVEL_START = 62;
    const TRAVEL_END = 910;

    const GATHER = {
      hip: [-2, 85], back: [-9, 64], nape: [-4, 39], crown: [0, 17], brow: [10, 17], nose: [16, 25], chin: [11, 36], throat: [4, 45], chest: [2, 56],
      leadShoulder: [1, 51], leadElbow: [16, 57], leadWrist: [29, 53], leadHand: [37, 48],
      followingShoulder: [-1, 53], followingElbow: [10, 65], followingWrist: [25, 68], followingHand: [34, 65],
      groundedKnee: [-15, 102], groundedAnkle: [-21, 117], groundedHeel: [-18, 120], groundedToe: [-7, 120],
      steppingKnee: [12, 103], steppingAnkle: [24, 117], steppingHeel: [23, 120], steppingToe: [37, 120],
      centreLeft: [-8, 73], centreRight: [10, 72]
    };

    const SINK = {
      hip: [-1, 90], back: [-9, 68], nape: [-4, 43], crown: [0, 21], brow: [10, 21], nose: [16, 29], chin: [11, 40], throat: [4, 49], chest: [2, 60],
      leadShoulder: [1, 55], leadElbow: [17, 62], leadWrist: [31, 57], leadHand: [39, 51],
      followingShoulder: [-1, 57], followingElbow: [10, 69], followingWrist: [25, 72], followingHand: [35, 68],
      groundedKnee: [-17, 104], groundedAnkle: [-23, 117], groundedHeel: [-20, 120], groundedToe: [-8, 120],
      steppingKnee: [14, 106], steppingAnkle: [27, 117], steppingHeel: [26, 120], steppingToe: [40, 120],
      centreLeft: [-8, 77], centreRight: [11, 76]
    };

    const STEP = {
      hip: [-3, 87], back: [-10, 65], nape: [-4, 40], crown: [0, 18], brow: [10, 18], nose: [16, 26], chin: [11, 37], throat: [4, 46], chest: [2, 57],
      leadShoulder: [1, 52], leadElbow: [18, 58], leadWrist: [34, 54], leadHand: [43, 48],
      followingShoulder: [-1, 55], followingElbow: [11, 66], followingWrist: [28, 67], followingHand: [39, 62],
      groundedKnee: [-17, 103], groundedAnkle: [-24, 117], groundedHeel: [-21, 120], groundedToe: [-8, 120],
      steppingKnee: [18, 101], steppingAnkle: [38, 114], steppingHeel: [43, 117], steppingToe: [57, 117],
      centreLeft: [-9, 74], centreRight: [11, 73]
    };

    const WARD = {
      hip: [0, 85], back: [-8, 63], nape: [-3, 38], crown: [1, 16], brow: [11, 16], nose: [17, 24], chin: [12, 35], throat: [5, 44], chest: [3, 55],
      leadShoulder: [2, 50], leadElbow: [19, 45], leadWrist: [37, 36], leadHand: [51, 31],
      followingShoulder: [0, 53], followingElbow: [11, 61], followingWrist: [25, 68], followingHand: [36, 68],
      groundedKnee: [-13, 102], groundedAnkle: [-19, 117], groundedHeel: [-17, 120], groundedToe: [-5, 120],
      steppingKnee: [17, 99], steppingAnkle: [29, 114], steppingHeel: [27, 119], steppingToe: [45, 119],
      centreLeft: [-7, 72], centreRight: [12, 71]
    };

    const PRESS = {
      hip: [2, 84], back: [-6, 61], nape: [-2, 37], crown: [2, 15], brow: [12, 15], nose: [18, 23], chin: [13, 34], throat: [6, 43], chest: [4, 54],
      leadShoulder: [3, 49], leadElbow: [20, 47], leadWrist: [39, 42], leadHand: [54, 37],
      followingShoulder: [1, 52], followingElbow: [18, 56], followingWrist: [35, 50], followingHand: [48, 43],
      groundedKnee: [-10, 101], groundedAnkle: [-16, 117], groundedHeel: [-14, 120], groundedToe: [-2, 120],
      steppingKnee: [18, 98], steppingAnkle: [28, 114], steppingHeel: [26, 119], steppingToe: [45, 119],
      centreLeft: [-5, 71], centreRight: [14, 70]
    };

    const PUSH = {
      hip: [4, 84], back: [-4, 61], nape: [0, 37], crown: [4, 15], brow: [14, 15], nose: [20, 23], chin: [15, 34], throat: [8, 43], chest: [6, 54],
      leadShoulder: [5, 49], leadElbow: [24, 47], leadWrist: [45, 41], leadHand: [62, 35],
      followingShoulder: [3, 52], followingElbow: [21, 54], followingWrist: [41, 48], followingHand: [58, 41],
      groundedKnee: [-7, 100], groundedAnkle: [-13, 117], groundedHeel: [-11, 120], groundedToe: [1, 120],
      steppingKnee: [19, 97], steppingAnkle: [29, 114], steppingHeel: [27, 119], steppingToe: [46, 119],
      centreLeft: [-3, 71], centreRight: [16, 70]
    };

    const TAI_CHI_KEYFRAMES = [
      { at: 0, name: "Gather", pose: GATHER },
      { at: .13, name: "Gather", pose: GATHER },
      { at: .27, name: "Sink", pose: SINK },
      { at: .44, name: "Step", pose: STEP },
      { at: .62, name: "Ward", pose: WARD },
      { at: .79, name: "Press", pose: PRESS },
      { at: .92, name: "Push", pose: PUSH },
      { at: 1, name: "Settle", pose: PUSH }
    ];

    const liveGesture = document.querySelector("#live-gesture");
    const trailLayer = document.querySelector("#gesture-trails");
    const phaseName = document.querySelector("#phase-name");
    const pauseButton = document.querySelector("#pause-animation");
    const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
    const strokeNodes = Object.fromEntries([...liveGesture.querySelectorAll("[data-stroke]")].map(node => [node.dataset.stroke, node]));
    const trails = [];

    const mix = (a, b, amount) => a + (b - a) * amount;
    const clamp = (value, min = 0, max = 1) => Math.min(max, Math.max(min, value));
    const smooth = value => {
      const x = clamp(value);
      return x * x * (3 - 2 * x);
    };
    const pointMix = (a, b, amount) => [mix(a[0], b[0], amount), mix(a[1], b[1], amount)];

    function mixPose(a, b, amount) {
      return Object.fromEntries(Object.keys(a).map(key => [key, pointMix(a[key], b[key], amount)]));
    }

    function samplePose(progress) {
      let index = TAI_CHI_KEYFRAMES.findIndex(frame => frame.at >= progress);
      if (index <= 0) index = 1;
      const before = TAI_CHI_KEYFRAMES[index - 1];
      const after = TAI_CHI_KEYFRAMES[index];
      const span = after.at - before.at;
      const local = smooth(span === 0 ? 0 : (progress - before.at) / span);
      return { pose: mixPose(before.pose, after.pose, local), name: after.name };
    }

    const p = point => `${point[0].toFixed(2)} ${point[1].toFixed(2)}`;

    function gesturePaths(pose) {
      const brow = [pose.brow[0] - 3, pose.brow[1] + 1];
      const nose = [pose.nose[0] - 5, pose.nose[1]];
      const upperNape = [pose.nape[0] - 2, pose.nape[1] - 10];
      const rearCrown = [pose.crown[0] - 4, pose.crown[1] + 1];
      const softFront = [pose.centreRight[0] + 2, pose.centreRight[1] - 7];
      const liftedHip = [pose.hip[0], pose.hip[1] - 7];
      return {
        spine: `M ${p(liftedHip)} C ${p(pose.back)} ${p(pose.nape)} ${p(pose.nape)} C ${p(upperNape)} ${p(rearCrown)} ${p(pose.crown)} C ${p(brow)} ${p(brow)} ${p(nose)}`,
        "lead-arm": `M ${p(pose.leadShoulder)} C ${p(pose.leadElbow)} ${p(pose.leadWrist)} ${p(pose.leadHand)}`,
        "following-arm": `M ${p(pose.followingShoulder)} C ${p(pose.followingElbow)} ${p(pose.followingWrist)} ${p(pose.followingHand)}`,
        "grounded-leg": `M ${p(liftedHip)} C ${p(pose.groundedKnee)} ${p(pose.groundedAnkle)} ${p(pose.groundedHeel)} Q ${p(pose.groundedHeel)} ${p(pose.groundedToe)}`,
        "stepping-leg": `M ${p(liftedHip)} C ${p(pose.steppingKnee)} ${p(pose.steppingAnkle)} ${p(pose.steppingHeel)} Q ${p(pose.steppingHeel)} ${p(pose.steppingToe)}`,
        centre: `M ${p(pose.throat)} C ${p(pose.chest)} ${p(pose.chest)} ${p(softFront)}`
      };
    }

    function renderGesture(progress) {
      const sampled = samplePose(progress);
      const paths = gesturePaths(sampled.pose);
      Object.entries(paths).forEach(([name, path]) => strokeNodes[name].setAttribute("d", path));
      const x = mix(TRAVEL_START, TRAVEL_END, smooth(progress));
      const fadeIn = smooth(progress / .055);
      const fadeOut = 1 - smooth((progress - .93) / .07);
      liveGesture.setAttribute("transform", `translate(${x.toFixed(2)} 0)`);
      liveGesture.style.opacity = (fadeIn * fadeOut).toFixed(3);
      phaseName.textContent = sampled.name;
      return fadeIn * fadeOut;
    }

    function captureTrail(now, cycle) {
      const snapshot = liveGesture.cloneNode(true);
      snapshot.removeAttribute("id");
      snapshot.classList.add("trail-snapshot");
      snapshot.style.opacity = "0.25";
      trailLayer.append(snapshot);
      trails.push({ node: snapshot, born: now, cycle });
    }

    function renderTrails(now) {
      for (let index = trails.length - 1; index >= 0; index -= 1) {
        const trail = trails[index];
        const age = now - trail.born;
        if (age >= TRAIL_LIFETIME_MS) {
          trail.node.remove();
          trails.splice(index, 1);
          continue;
        }
        const life = 1 - age / TRAIL_LIFETIME_MS;
        trail.node.style.opacity = (life * life * .27).toFixed(3);
      }
    }

    function clearTrails() {
      trails.splice(0).forEach(trail => trail.node.remove());
    }

    let startTime = performance.now();
    let lastSample = startTime;
    let previousCycle = -1;
    let pausedAt = null;
    let animationFrame = null;

    function tick(now) {
      const elapsed = now - startTime;
      const cycle = Math.floor(elapsed / MOVEMENT_LOOP_MS);
      const progress = (elapsed % MOVEMENT_LOOP_MS) / MOVEMENT_LOOP_MS;

      if (cycle !== previousCycle) {
        clearTrails();
        previousCycle = cycle;
        lastSample = now;
      }

      const visibility = renderGesture(progress);
      if (now - lastSample >= TRAIL_SAMPLE_MS && visibility > .45 && progress < .9) {
        captureTrail(now, cycle);
        lastSample = now;
      }
      renderTrails(now);
      animationFrame = requestAnimationFrame(tick);
    }

    pauseButton.addEventListener("click", () => {
      if (reducedMotion.matches) return;
      if (pausedAt === null) {
        pausedAt = performance.now();
        cancelAnimationFrame(animationFrame);
        pauseButton.textContent = "Continue";
      } else {
        const now = performance.now();
        const pauseLength = now - pausedAt;
        startTime += pauseLength;
        trails.forEach(trail => { trail.born += pauseLength; });
        lastSample += pauseLength;
        pausedAt = null;
        pauseButton.textContent = "Pause";
        animationFrame = requestAnimationFrame(tick);
      }
    });

    document.querySelector("#replay-animation").addEventListener("click", () => {
      startTime = performance.now();
      lastSample = startTime;
      previousCycle = -1;
      clearTrails();
      renderGesture(0);
      if (pausedAt !== null) pausedAt = startTime;
    });

    if (reducedMotion.matches) {
      renderGesture(.79);
      liveGesture.style.display = "none";
      phaseName.textContent = "Still pose";
      pauseButton.disabled = true;
    } else {
      animationFrame = requestAnimationFrame(tick);
    }
  </script>
</body>
</html>
