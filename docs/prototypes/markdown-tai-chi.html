<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markdown tai chi — Wudang motion study</title>
  <style>
    :root {
      color-scheme: light dark;
      --paper: #f2f0e7;
      --paper-deep: #e4eae1;
      --ink: #152f27;
      --ink-soft: #557168;
      --line: rgba(21, 47, 39, .15);
      --accent: #159447;
      --accent-soft: rgba(21, 148, 71, .14);
      --panel: rgba(255, 255, 255, .54);
      --shadow: rgba(21, 47, 39, .13);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background:
        radial-gradient(circle at 44% 39%, rgba(255,255,255,.94) 0 17%, transparent 49%),
        linear-gradient(145deg, var(--paper), var(--paper-deep));
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(1rem, 4vw, 3rem);
    }

    .study {
      width: min(96vw, 70rem);
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(16rem, .72fr);
      gap: clamp(1.75rem, 4vw, 4.75rem);
      align-items: center;
    }

    .stage-shell {
      position: relative;
      aspect-ratio: 1;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: clamp(1.75rem, 4vw, 3.25rem);
      background: rgba(255,255,255,.25);
      box-shadow: 0 2rem 5rem var(--shadow), inset 0 1px rgba(255,255,255,.76);
    }

    .stage-shell::before {
      content: "";
      position: absolute;
      inset: 13%;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-soft), transparent 69%);
      filter: blur(18px);
    }

    #motion-stage {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
    }

    .enso {
      fill: none;
      stroke: var(--ink);
      stroke-width: 4;
      stroke-linecap: round;
      opacity: .055;
    }

    .ground { stroke: var(--line); stroke-width: 1.4; }
    .ground-glow { stroke: var(--accent); stroke-width: 3; opacity: .12; filter: blur(5px); }

    .figure-underlay {
      fill: var(--ink);
      fill-opacity: .035;
      stroke: var(--ink);
      stroke-opacity: .11;
      stroke-width: 1.1;
      stroke-linejoin: round;
      transition: opacity 160ms ease;
    }

    .limb-underlay {
      fill: none;
      stroke: var(--ink);
      stroke-opacity: .055;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .master-glyph {
      fill: var(--ink);
      font-weight: 720;
      dominant-baseline: middle;
      text-anchor: middle;
      paint-order: stroke;
      stroke: rgba(242, 240, 231, .3);
      stroke-width: .35px;
    }

    .master-glyph.accent { fill: var(--accent); }
    .master-glyph.edge { font-weight: 900; }

    .construction {
      fill: none;
      stroke: #d97706;
      stroke-width: 1.3;
      stroke-dasharray: 4 6;
      opacity: 0;
      pointer-events: none;
    }

    .construction-joint { fill: #d97706; stroke: none; opacity: 0; }
    .show-skeleton .construction { opacity: .42; }
    .show-skeleton .construction-joint { opacity: .55; }

    #static-figure[hidden] { display: none; }
    #static-figure text { fill: var(--ink); font-weight: 750; text-anchor: middle; }
    #static-figure .fallback-accent { fill: var(--accent); }

    .eyebrow {
      margin: 0 0 .65rem;
      color: var(--accent);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 10ch;
      margin: 0;
      font-family: ui-serif, Georgia, Cambria, "Times New Roman", serif;
      font-size: clamp(2.55rem, 6.3vw, 5.35rem);
      font-weight: 500;
      letter-spacing: -.057em;
      line-height: .91;
    }

    .lede {
      max-width: 30rem;
      margin: 1.25rem 0 1.65rem;
      color: var(--ink-soft);
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: clamp(.95rem, 2vw, 1.08rem);
      line-height: 1.6;
    }

    .movement-name {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      margin-bottom: 1rem;
      color: var(--ink-soft);
      font-size: .68rem;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .movement-name::before {
      content: "";
      width: 1.7rem;
      height: 1px;
      background: var(--accent);
    }

    .phase-readout {
      display: flex;
      align-items: center;
      gap: .65rem;
      min-height: 1.5rem;
      margin-bottom: 1rem;
      color: var(--ink-soft);
      font-size: .72rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .phase-dot {
      width: .5rem;
      height: .5rem;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 .35rem var(--accent-soft);
    }

    .controls { display: flex; flex-wrap: wrap; gap: .5rem; }

    button {
      appearance: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: .6rem .86rem;
      color: var(--ink);
      background: var(--panel);
      font: 650 .72rem/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      cursor: pointer;
      transition: border-color 150ms ease, background 150ms ease, transform 150ms ease;
    }

    button:hover { border-color: var(--accent); transform: translateY(-1px); }
    button:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }
    button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
    button:disabled { cursor: default; opacity: .45; transform: none; }

    .hint {
      margin: .9rem 0 0;
      color: var(--ink-soft);
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: .75rem;
      line-height: 1.45;
    }

    @media (max-width: 760px) {
      main { align-items: start; }
      .study { grid-template-columns: 1fr; width: min(96vw, 37rem); }
      .stage-shell { order: 2; }
      .copy { order: 1; padding: .5rem .2rem 0; }
      h1 { max-width: 12ch; font-size: clamp(2.65rem, 13vw, 4.5rem); }
      .lede { margin-bottom: 1.15rem; }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #0c1713;
        --paper-deep: #13221c;
        --ink: #e5efe8;
        --ink-soft: #9eb2a8;
        --line: rgba(229, 239, 232, .16);
        --accent: #4ade80;
        --accent-soft: rgba(74, 222, 128, .14);
        --panel: rgba(12, 23, 19, .64);
        --shadow: rgba(0, 0, 0, .3);
      }
      body { background: radial-gradient(circle at 44% 39%, rgba(31,55,44,.84), transparent 48%), linear-gradient(145deg, var(--paper), var(--paper-deep)); }
      .stage-shell { background: rgba(8,14,12,.24); box-shadow: 0 2rem 5rem var(--shadow), inset 0 1px rgba(255,255,255,.06); }
      .master-glyph { stroke: rgba(12, 23, 19, .25); }
    }

    @media (prefers-reduced-motion: reduce) {
      #motion-stage * { animation: none !important; transition: none !important; }
      .phase-dot { box-shadow: none; }
    }
  </style>
</head>
<body data-study-version="2" data-reference-movement="parting-wild-horse-mane">
  <main>
    <section class="study" aria-labelledby="study-title">
      <div class="stage-shell">
        <svg id="motion-stage" viewBox="0 0 600 600" role="img" aria-label="A robed figure made from Markdown characters performing Parting the Wild Horse's Mane">
          <path class="enso" d="M 177 427 C 92 321 124 158 261 99 C 397 40 526 137 518 280 C 512 398 426 489 310 503"></path>
          <line class="ground-glow" x1="126" y1="506" x2="493" y2="506"></line>
          <line class="ground" x1="126" y1="506" x2="493" y2="506"></line>

          <g id="static-figure" aria-hidden="true">

          </g>
        </svg>
      </div>

      <div class="copy">
        <p class="eyebrow">Motion study 02 · Wudang silhouette</p>
        <h1 id="study-title">The source learns to flow.</h1>
        <p class="lede">A figure of Markdown takes one slow step through <em>Parting the Wild Horse's Mane</em>.</p>
        <div class="movement-name">Near-side view · facing right</div>
        <div class="phase-readout" aria-live="polite">
          <span class="phase-dot" aria-hidden="true"></span>
          <span id="phase-name">Compose</span>
        </div>
        <div class="controls" aria-label="Animation review controls">
          <button type="button" id="pause-animation">Pause</button>
          <button type="button" id="replay-animation">Replay</button>
          <button type="button" id="toggle-skeleton" aria-pressed="false">Show construction</button>
        </div>
        <p class="hint">Version 2 review study. The homepage is unchanged.</p>
      </div>
    </section>
  </main>

  <script>
    const SVG_NS = "http://www.w3.org/2000/svg";
    const COMPOSE_ONCE_MS = 1650;
    const MOVEMENT_LOOP_MS = 11200;
    const FABRIC_LAG = 0.032;

    const WUDANG_PARTS = {
      robe: { rows: 9, columns: 6 },
      sleeves: { along: 7, across: 3 },
      legs: { along: 7, across: 3 },
      coatTails: { rows: 6, columns: 2 },
      head: { count: 15 },
      topknot: { count: 7 }
    };

    const CRADLE = {
      head: [304, 143], topknot: [300, 111], neck: [302, 180],
      shoulderBack: [284, 207], shoulderFront: [322, 201], hipBack: [283, 330], hipFront: [318, 328],
      backElbow: [305, 243], backHand: [347, 270], frontElbow: [350, 224], frontHand: [376, 255],
      backKnee: [256, 406], backFoot: [224, 494], frontKnee: [354, 404], frontFoot: [382, 494]
    };

    const SINK = {
      head: [302, 148], topknot: [298, 116], neck: [300, 185],
      shoulderBack: [282, 212], shoulderFront: [320, 206], hipBack: [278, 338], hipFront: [313, 336],
      backElbow: [305, 250], backHand: [342, 279], frontElbow: [347, 234], frontHand: [373, 264],
      backKnee: [249, 414], backFoot: [218, 494], frontKnee: [356, 414], frontFoot: [386, 494]
    };

    const STEP = {
      head: [311, 146], topknot: [307, 114], neck: [309, 183],
      shoulderBack: [291, 210], shoulderFront: [329, 204], hipBack: [289, 336], hipFront: [324, 334],
      backElbow: [316, 250], backHand: [354, 267], frontElbow: [354, 232], frontHand: [377, 267],
      backKnee: [254, 411], backFoot: [219, 494], frontKnee: [386, 424], frontFoot: [438, 494]
    };

    const PART = {
      head: [326, 143], topknot: [322, 111], neck: [324, 180],
      shoulderBack: [305, 208], shoulderFront: [343, 201], hipBack: [306, 332], hipFront: [341, 330],
      backElbow: [320, 257], backHand: [313, 304], frontElbow: [389, 225], frontHand: [430, 212],
      backKnee: [268, 408], backFoot: [222, 494], frontKnee: [402, 409], frontFoot: [450, 494]
    };

    const SETTLE = {
      head: [338, 140], topknot: [334, 108], neck: [336, 177],
      shoulderBack: [317, 205], shoulderFront: [355, 198], hipBack: [319, 328], hipFront: [354, 326],
      backElbow: [327, 260], backHand: [310, 309], frontElbow: [407, 224], frontHand: [462, 205],
      backKnee: [276, 407], backFoot: [224, 494], frontKnee: [413, 404], frontFoot: [462, 494]
    };

    const WILD_HORSE_KEYFRAMES = [
      { at: 0, name: "Cradle", pose: CRADLE },
      { at: .11, name: "Cradle", pose: CRADLE },
      { at: .23, name: "Sink", pose: SINK },
      { at: .38, name: "Step", pose: STEP },
      { at: .58, name: "Part", pose: PART },
      { at: .72, name: "Settle", pose: SETTLE },
      { at: .82, name: "Settle", pose: SETTLE },
      { at: .9, name: "Return", pose: STEP },
      { at: 1, name: "Cradle", pose: CRADLE }
    ];

    const TOKENS = ["#", "**", "_", ">", "[]", "`", "*", "-", "()", "[", "]", "~", "##", "__"];
    const stage = document.querySelector("#motion-stage");
    const staticFigure = document.querySelector("#static-figure");
    const phaseName = document.querySelector("#phase-name");
    const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");

    const robeGroup = document.querySelector("#robe-glyphs");
    const sleeveGroup = document.querySelector("#sleeve-glyphs");
    const legGroup = document.querySelector("#leg-glyphs");
    const tailGroup = document.querySelector("#tail-glyphs");
    const headGroup = document.querySelector("#head-glyphs");
    const topknotGroup = document.querySelector("#topknot-glyphs");

    const clamp = (value, min = 0, max = 1) => Math.min(max, Math.max(min, value));
    const mix = (a, b, amount) => a + (b - a) * amount;
    const ease = value => value < .5 ? 4 * value ** 3 : 1 - ((-2 * value + 2) ** 3) / 2;
    const pointMix = (a, b, amount) => [mix(a[0], b[0], amount), mix(a[1], b[1], amount)];

    function mixPose(a, b, amount) {
      return Object.fromEntries(Object.keys(a).map(key => [key, pointMix(a[key], b[key], amount)]));
    }

    function sampleMovement(cycle) {
      const wrapped = ((cycle % 1) + 1) % 1;
      let index = WILD_HORSE_KEYFRAMES.findIndex(frame => frame.at >= wrapped);
      if (index <= 0) index = 1;
      const before = WILD_HORSE_KEYFRAMES[index - 1];
      const after = WILD_HORSE_KEYFRAMES[index];
      const local = ease((wrapped - before.at) / (after.at - before.at));
      return { pose: mixPose(before.pose, after.pose, local), name: after.name };
    }

    function makeGlyph(group, index, region, edge = false) {
      const node = document.createElementNS(SVG_NS, "text");
      node.classList.add("master-glyph");
      if (edge) node.classList.add("edge");
      if ((index + region.length) % 17 === 0) node.classList.add("accent");
      node.textContent = TOKENS[(index * 5 + region.length * 3) % TOKENS.length];
      node.setAttribute("font-size", edge ? "15" : index % 9 === 0 ? "14" : "11.5");
      group.append(node);
      return { node, index, region };
    }

    const robeGlyphs = [];
    for (let row = 0; row < WUDANG_PARTS.robe.rows; row += 1) {
      for (let column = 0; column < WUDANG_PARTS.robe.columns; column += 1) {
        const edge = column === 0 || column === WUDANG_PARTS.robe.columns - 1 || row === WUDANG_PARTS.robe.rows - 1;
        robeGlyphs.push({ ...makeGlyph(robeGroup, robeGlyphs.length, "robe", edge), row, column });
      }
    }

    function makeLimbGlyphs(group, region, limbs, alongCount, acrossCount) {
      const glyphs = [];
      limbs.forEach(limb => {
        for (let along = 0; along < alongCount; along += 1) {
          for (let across = 0; across < acrossCount; across += 1) {
            const edge = across === 0 || across === acrossCount - 1 || along === alongCount - 1;
            glyphs.push({ ...makeGlyph(group, glyphs.length, region, edge), limb, along, across, alongCount, acrossCount });
          }
        }
      });
      return glyphs;
    }

    const sleeveGlyphs = makeLimbGlyphs(sleeveGroup, "sleeves", ["back", "front"], WUDANG_PARTS.sleeves.along, WUDANG_PARTS.sleeves.across);
    const legGlyphs = makeLimbGlyphs(legGroup, "legs", ["back", "front"], WUDANG_PARTS.legs.along, WUDANG_PARTS.legs.across);

    const tailGlyphs = [];
    ["back", "front"].forEach(tail => {
      for (let row = 0; row < WUDANG_PARTS.coatTails.rows; row += 1) {
        for (let column = 0; column < WUDANG_PARTS.coatTails.columns; column += 1) {
          tailGlyphs.push({ ...makeGlyph(tailGroup, tailGlyphs.length, "coat-tails", column === 0 || row === WUDANG_PARTS.coatTails.rows - 1), tail, row, column });
        }
      }
    });

    const headGlyphs = Array.from({ length: WUDANG_PARTS.head.count }, (_, index) => makeGlyph(headGroup, index, "head", index % 4 === 0));
    const topknotGlyphs = Array.from({ length: WUDANG_PARTS.topknot.count }, (_, index) => makeGlyph(topknotGroup, index, "topknot", true));
    const allGlyphs = [...tailGlyphs, ...legGlyphs, ...robeGlyphs, ...sleeveGlyphs, ...headGlyphs, ...topknotGlyphs];

    function sourcePoint(index) {
      const angle = index * 2.399963 + .65;
      const radius = 135 + (index % 10) * 12;
      return [306 + Math.cos(angle) * radius, 295 + Math.sin(angle) * radius * .82, angle];
    }

    function setGlyph(glyph, target, form, rotation = 0) {
      const source = sourcePoint(glyph.index + allGlyphs.indexOf(glyph));
      const x = mix(source[0], target[0], form);
      const y = mix(source[1], target[1], form);
      const angle = mix(source[2], rotation, form) * 180 / Math.PI;
      glyph.node.setAttribute("x", x.toFixed(2));
      glyph.node.setAttribute("y", y.toFixed(2));
      glyph.node.setAttribute("transform", `rotate(${angle.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)})`);
      glyph.node.setAttribute("opacity", (.18 + form * .82).toFixed(2));
    }

    function quadPoint(topLeft, topRight, bottomLeft, bottomRight, u, v) {
      return pointMix(pointMix(topLeft, topRight, u), pointMix(bottomLeft, bottomRight, u), v);
    }

    function robeCorners(pose) {
      return {
        topBack: [pose.shoulderBack[0] - 8, pose.shoulderBack[1] - 5],
        topFront: [pose.shoulderFront[0] + 10, pose.shoulderFront[1] - 2],
        bottomBack: [pose.hipBack[0] - 42, pose.hipBack[1] + 119],
        bottomFront: [pose.hipFront[0] + 43, pose.hipFront[1] + 119]
      };
    }

    function renderRobeField(pose, form) {
      const corners = robeCorners(pose);
      robeGlyphs.forEach(glyph => {
        const v = glyph.row / (WUDANG_PARTS.robe.rows - 1);
        const inset = Math.sin(v * Math.PI) * .025;
        const u = inset + (glyph.column / (WUDANG_PARTS.robe.columns - 1)) * (1 - inset * 2);
        const point = quadPoint(corners.topBack, corners.topFront, corners.bottomBack, corners.bottomFront, u, v);
        point[0] += Math.sin(glyph.row * 1.7 + glyph.column) * 2.1;
        setGlyph(glyph, point, form, -.06 + v * .05);
      });
      document.querySelector("#robe-underlay").setAttribute("d", `M ${corners.topBack} Q ${pose.neck[0]} ${pose.neck[1] - 4} ${corners.topFront} L ${corners.bottomFront} Q ${(corners.bottomFront[0] + corners.bottomBack[0]) / 2} ${corners.bottomFront[1] + 10} ${corners.bottomBack} Z`);
    }

    function pointOnBentLimb(start, bend, end, along) {
      if (along <= .5) return pointMix(start, bend, along * 2);
      return pointMix(bend, end, (along - .5) * 2);
    }

    function tangentOnBentLimb(start, bend, end, along) {
      const a = along <= .5 ? start : bend;
      const b = along <= .5 ? bend : end;
      const angle = Math.atan2(b[1] - a[1], b[0] - a[0]);
      return { angle, perpendicular: [-Math.sin(angle), Math.cos(angle)] };
    }

    function limbTarget(pose, glyph, type) {
      const prefix = glyph.limb;
      const start = type === "arm" ? pose[`${prefix === "front" ? "shoulderFront" : "shoulderBack"}`] : pose[`${prefix === "front" ? "hipFront" : "hipBack"}`];
      const bend = pose[`${prefix}${type === "arm" ? "Elbow" : "Knee"}`];
      const end = pose[`${prefix}${type === "arm" ? "Hand" : "Foot"}`];
      const along = glyph.along / (glyph.alongCount - 1);
      const across = glyph.across / (glyph.acrossCount - 1) - .5;
      const centre = pointOnBentLimb(start, bend, end, along);
      const tangent = tangentOnBentLimb(start, bend, end, along);
      const width = type === "arm" ? mix(31, 17, along) : mix(25, 17, along);
      return { point: [centre[0] + tangent.perpendicular[0] * width * across, centre[1] + tangent.perpendicular[1] * width * across], angle: tangent.angle };
    }

    function renderSleeveField(pose, form) {
      sleeveGlyphs.forEach(glyph => {
        const target = limbTarget(pose, glyph, "arm");
        setGlyph(glyph, target.point, form, target.angle);
      });
      document.querySelector("#back-sleeve-underlay").setAttribute("d", `M ${pose.shoulderBack} Q ${pose.backElbow} ${pose.backHand}`);
      document.querySelector("#front-sleeve-underlay").setAttribute("d", `M ${pose.shoulderFront} Q ${pose.frontElbow} ${pose.frontHand}`);
    }

    function renderLegField(pose, form) {
      legGlyphs.forEach(glyph => {
        const target = limbTarget(pose, glyph, "leg");
        setGlyph(glyph, target.point, form, target.angle);
      });
      document.querySelector("#back-leg-underlay").setAttribute("d", `M ${pose.hipBack} Q ${pose.backKnee} ${pose.backFoot}`);
      document.querySelector("#front-leg-underlay").setAttribute("d", `M ${pose.hipFront} Q ${pose.frontKnee} ${pose.frontFoot}`);
    }

    function tailCorners(pose, tail) {
      if (tail === "back") {
        return {
          topLeft: [pose.hipBack[0] - 22, pose.hipBack[1] - 6], topRight: [pose.hipFront[0] - 4, pose.hipFront[1] + 2],
          bottomLeft: [pose.backKnee[0] - 39, pose.backKnee[1] + 49], bottomRight: [pose.backKnee[0] + 7, pose.backKnee[1] + 61]
        };
      }
      return {
        topLeft: [pose.hipBack[0] + 3, pose.hipBack[1]], topRight: [pose.hipFront[0] + 27, pose.hipFront[1] - 4],
        bottomLeft: [pose.frontKnee[0] - 29, pose.frontKnee[1] + 44], bottomRight: [pose.frontKnee[0] + 22, pose.frontKnee[1] + 50]
      };
    }

    function renderCoatTails(fabricPose, form) {
      ["back", "front"].forEach(tail => {
        const corners = tailCorners(fabricPose, tail);
        tailGlyphs.filter(glyph => glyph.tail === tail).forEach(glyph => {
          const u = glyph.column / (WUDANG_PARTS.coatTails.columns - 1);
          const v = glyph.row / (WUDANG_PARTS.coatTails.rows - 1);
          const point = quadPoint(corners.topLeft, corners.topRight, corners.bottomLeft, corners.bottomRight, u, v);
          setGlyph(glyph, point, form, tail === "back" ? .14 : -.08);
        });
        document.querySelector(`#tail-underlay-${tail}`).setAttribute("d", `M ${corners.topLeft} L ${corners.topRight} L ${corners.bottomRight} Q ${(corners.bottomRight[0] + corners.bottomLeft[0]) / 2} ${corners.bottomRight[1] + 8} ${corners.bottomLeft} Z`);
      });
    }

    function renderHead(pose, form) {
      headGlyphs.forEach((glyph, index) => {
        const angle = index / headGlyphs.length * Math.PI * 2 - Math.PI / 2;
        const radiusX = index % 3 === 0 ? 18 : 13;
        const radiusY = index % 3 === 0 ? 24 : 18;
        const profileNudge = Math.cos(angle) > .65 ? 3.5 : 0;
        setGlyph(glyph, [pose.head[0] + Math.cos(angle) * radiusX + profileNudge, pose.head[1] + Math.sin(angle) * radiusY], form, angle + Math.PI / 2);
      });
      topknotGlyphs.forEach((glyph, index) => {
        const angle = index / topknotGlyphs.length * Math.PI * 2;
        setGlyph(glyph, [pose.topknot[0] + Math.cos(angle) * 8, pose.topknot[1] + Math.sin(angle) * 7], form, angle);
      });
      const underlay = document.querySelector("#head-underlay");
      underlay.setAttribute("cx", pose.head[0]);
      underlay.setAttribute("cy", pose.head[1]);
    }

    const jointNodes = Object.keys(CRADLE).map(key => {
      const circle = document.createElementNS(SVG_NS, "circle");
      circle.classList.add("construction-joint");
      circle.setAttribute("r", "2.8");
      document.querySelector("#construction-joints").append(circle);
      return { key, circle };
    });

    function renderConstruction(pose) {
      document.querySelector("#construction-spine").setAttribute("d", `M ${pose.head} L ${pose.neck} L ${(pose.hipBack[0] + pose.hipFront[0]) / 2} ${(pose.hipBack[1] + pose.hipFront[1]) / 2}`);
      document.querySelector("#construction-back-arm").setAttribute("d", `M ${pose.shoulderBack} L ${pose.backElbow} L ${pose.backHand}`);
      document.querySelector("#construction-front-arm").setAttribute("d", `M ${pose.shoulderFront} L ${pose.frontElbow} L ${pose.frontHand}`);
      document.querySelector("#construction-back-leg").setAttribute("d", `M ${pose.hipBack} L ${pose.backKnee} L ${pose.backFoot}`);
      document.querySelector("#construction-front-leg").setAttribute("d", `M ${pose.hipFront} L ${pose.frontKnee} L ${pose.frontFoot}`);
      jointNodes.forEach(({ key, circle }) => {
        circle.setAttribute("cx", pose[key][0]);
        circle.setAttribute("cy", pose[key][1]);
      });
    }

    function renderAt(form, cycle) {
      const body = sampleMovement(cycle);
      const fabric = sampleMovement(cycle - FABRIC_LAG);
      renderCoatTails(fabric.pose, form);
      renderLegField(body.pose, form);
      renderRobeField(body.pose, form);
      renderSleeveField(fabric.pose, form);
      renderHead(body.pose, form);
      renderConstruction(body.pose);
      phaseName.textContent = form < 1 ? "Compose" : body.name;
    }

    let startTime = performance.now();
    let pausedAt = null;
    let animationFrame = null;

    function tick(now) {
      const elapsed = now - startTime;
      const form = ease(clamp(elapsed / COMPOSE_ONCE_MS));
      const movementElapsed = Math.max(0, elapsed - COMPOSE_ONCE_MS);
      const cycle = (movementElapsed % MOVEMENT_LOOP_MS) / MOVEMENT_LOOP_MS;
      renderAt(form, cycle);
      animationFrame = requestAnimationFrame(tick);
    }

    const pauseButton = document.querySelector("#pause-animation");
    pauseButton.addEventListener("click", () => {
      if (reducedMotion.matches) return;
      if (pausedAt === null) {
        pausedAt = performance.now();
        cancelAnimationFrame(animationFrame);
        pauseButton.textContent = "Continue";
      } else {
        startTime += performance.now() - pausedAt;
        pausedAt = null;
        pauseButton.textContent = "Pause";
        animationFrame = requestAnimationFrame(tick);
      }
    });

    document.querySelector("#replay-animation").addEventListener("click", () => {
      startTime = performance.now();
      if (pausedAt !== null) pausedAt = startTime;
      renderAt(0, 0);
    });

    document.querySelector("#toggle-skeleton").addEventListener("click", event => {
      const pressed = event.currentTarget.getAttribute("aria-pressed") === "true";
      event.currentTarget.setAttribute("aria-pressed", String(!pressed));
      stage.classList.toggle("show-skeleton", !pressed);
    });

    staticFigure.toggleAttribute("hidden", true);
    if (reducedMotion.matches) {
      renderAt(1, .72);
      phaseName.textContent = "Still pose · reduced motion";
      pauseButton.disabled = true;
    } else {
      animationFrame = requestAnimationFrame(tick);
    }
  </script>
</body>
</html>
